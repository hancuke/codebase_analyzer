[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "change-analyzer"
version = "0.1.0"
description = "Map source snapshot changes to affected CodeGraph entry points."
requires-python = ">=3.10"
dependencies = [
    "codegraph",
    "filetracker",
]

[tool.uv.sources]
codegraph = { workspace = true }
filetracker = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
