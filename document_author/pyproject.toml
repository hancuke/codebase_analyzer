[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-author"
version = "0.1.0"
description = "Render structured authoring requests through an LLM."
requires-python = ">=3.10"
dependencies = ["document-updater"]

[tool.uv.sources]
document-updater = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
